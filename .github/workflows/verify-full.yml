# GitHub Actions Workflow for running the full plugin verification on demand.
# Pull requests only verify the oldest supported and the newest IDE release to stay fast;
# this one covers every recommended IDE including EAP builds, like the Release workflow does before publishing.
# Anyone with write access can start it from the Actions tab for any branch.

name: Full Plugin Verification
on:
  workflow_dispatch:

jobs:

  verify:
    name: Full plugin verification
    runs-on: ubuntu-latest
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Run Verify Plugin task and IntelliJ Plugin Verifier tool against every recommended IDE
      - name: Run Full Plugin Verification
        run: ./gradlew verifyPlugin -PfullVerification

      # Collect Plugin Verifier Result
      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier
